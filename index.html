<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <base target="_top">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Cerdas Cermat Online</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; margin: 0; padding: 15px; text-align: center; }
        .container { max-width: 800px; margin: auto; }
        .card { background: white; padding: 25px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); margin-bottom: 15px; position: relative; }
        
        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .school-header { display: flex; align-items: center; gap: 15px; text-align: left; }
        .school-logo { max-height: 65px; max-width: 90px; object-fit: contain; }
        .school-title { font-size: 20px; font-weight: bold; color: #1a252f; margin: 0; }
        .event-title { font-size: 14px; color: #007bff; font-weight: 600; margin-top: 3px; }

        .btn-logout { background-color: #6c757d; color: white; border: none; padding: 8px 14px; font-size: 13px; border-radius: 6px; cursor: pointer; }
        
        .login-hero { margin-bottom: 25px; padding-bottom: 15px; border-bottom: 2px solid #e9ecef; }
        .login-logo { max-height: 100px; margin-bottom: 12px; }
        .login-school-name { font-size: 22px; font-weight: bold; color: #2c3e50; margin: 0; }
        .login-event-name { font-size: 16px; font-weight: 600; color: #007bff; margin-top: 5px; }

        input[type="text"], input[type="password"] { padding: 12px; width: 85%; font-size: 16px; border: 1px solid #ccc; border-radius: 8px; margin-bottom: 12px; }
        button { padding: 10px 16px; font-size: 15px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; transition: 0.2s; }
        
        .btn-login { background-color: #007bff; color: white; width: 85%; padding: 12px; margin-top: 5px; border-radius: 8px; font-size: 16px; }
        
        .btn-bel { background-color: #dc3545; color: white; width: 100%; height: 150px; font-size: 36px; border-radius: 20px; box-shadow: 0 8px 0 #921c28; }
        .btn-bel:active { transform: translateY(4px); box-shadow: 0 4px 0 #921c28; }
        .btn-bel:disabled { background-color: #6c757d; box-shadow: none; cursor: not-allowed; opacity: 0.5; }
        
        .admin-controls { display: flex; gap: 10px; margin-bottom: 15px; }
        .btn-reset-bel { background-color: #28a745; color: white; font-size: 16px; flex: 2; padding: 12px; }
        .btn-reset-poin { background-color: #d9534f; color: white; font-size: 14px; flex: 1; padding: 12px; }

        .status-box { font-size: 22px; font-weight: bold; margin: 15px 0; padding: 15px; border-radius: 8px; background: #e9ecef; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; border-bottom: 1px solid #ddd; text-align: left; }
        th { background-color: #f8f9fa; }
        .poin-val { font-size: 20px; font-weight: bold; color: #007bff; text-align: right; }
        
        .btn-plus { background-color: #28a745; color: white; padding: 6px 8px; margin-left: 2px; font-size: 12px; }
        .btn-minus { background-color: #dc3545; color: white; padding: 6px 8px; margin-left: 2px; font-size: 12px; }
        .btn-edit { background-color: #ffc107; color: #212529; padding: 6px 8px; margin-left: 4px; font-size: 12px; }

        .test-audio-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 10px; }
        .btn-test-sound { background-color: #17a2b8; color: white; border: none; padding: 6px; font-size: 11px; border-radius: 4px; cursor: pointer; }

        /* ANIMASI LAMPU PIJAR */
        .bulb-box { margin: 15px 0; }
        .bulb-icon {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background-color: #3a3f51;
            color: #6c757d;
            font-size: 50px;
            line-height: 90px;
            display: inline-block;
            transition: all 0.3s ease;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
        }
        .bulb-icon.on {
            background-color: #ffee55;
            color: #d35400;
            box-shadow: 0 0 35px #ffeb3b, 0 0 70px #ff9800, 0 0 100px #ff5722;
            animation: bulb-pulse 0.7s infinite alternate;
        }
        @keyframes bulb-pulse {
            from { transform: scale(1); box-shadow: 0 0 30px #ffeb3b, 0 0 60px #ff9800; }
            to { transform: scale(1.08); box-shadow: 0 0 50px #ffee55, 0 0 90px #ff5722; }
        }

        .row-winner { background-color: #fff3cd !important; font-weight: bold; }

        .monitor-card { background: linear-gradient(135deg, #1e3c72, #2a5298); color: white; padding: 35px 20px; border-radius: 20px; }
        .monitor-header { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-bottom: 15px; }
        .monitor-logo { max-height: 100px; }
        .monitor-school { font-size: 24px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
        .monitor-event { font-size: 18px; color: #ffd700; font-weight: 600; text-transform: uppercase; }
        .monitor-group { font-size: 40px; font-weight: bold; margin-top: 10px; color: #ffffff; }
        .monitor-score-label { font-size: 20px; margin-top: 15px; opacity: 0.8; }
        .monitor-score-val { font-size: 110px; font-weight: 900; line-height: 1; margin: 10px 0; color: #00ffcc; }
    </style>
</head>
<body>

<div class="container">

    <div id="headerBar" class="header-bar" style="display:none;">
        <div class="school-header">
            <img id="imgLogo" class="school-logo" src="" alt="Logo">
            <div>
                <h1 id="txtNamaSekolah" class="school-title"></h1>
                <div id="txtNamaKegiatan" class="event-title"></div>
            </div>
        </div>
        <button class="btn-logout" onclick="logout()">🚪 Logout</button>
    </div>

    <!-- FORM LOGIN -->
    <div class="card" id="loginCard">
        <div class="login-hero">
            <img id="loginImgLogo" class="login-logo" src="" alt="Logo Sekolah" style="display:none;">
            <h2 id="loginTxtSekolah" class="login-school-name">Memuat Data...</h2>
            <div id="loginTxtKegiatan" class="login-event-name"></div>
        </div>

        <p style="color:#6c757d; margin-bottom: 20px;">Masukkan Username dan Password Anda</p>
        <input type="text" id="usernameInput" placeholder="Username (misal: kelompok1 / monitor1 / admin)">
        <br>
        <input type="password" id="passwordInput" placeholder="Password">
        <br>
        <button class="btn-login" onclick="login()">MASUK APLIKASI</button>
        <p id="loginError" style="color:red; margin-top:10px; font-weight:bold;"></p>
    </div>

    <!-- TAMPILAN PESERTA & ADMIN -->
    <div id="appCard" style="display:none;">
        <div class="card">
            <h2 id="kelompokTitle" style="margin-top:0;"></h2>
            
            <div class="bulb-box">
                <div id="appBulb" class="bulb-icon">💡</div>
            </div>

            <div id="statusBox" class="status-box">Menghubungkan...</div>

            <button id="tombolBel" class="btn-bel" onclick="prosesTekanBel()" style="display:none;">🔔 TEKAN BEL!</button>

            <!-- PANEL ADMIN -->
            <div id="adminPanel" style="display:none;">
                <div class="admin-controls">
                    <button class="btn-reset-bel" onclick="prosesResetBel()">🔄 Reset Bel (Soal Baru)</button>
                    <button class="btn-reset-poin" onclick="prosesResetSemuaPoin()">⚠️ Reset Semua Skor</button>
                </div>
                
                <div style="font-size:12px; font-weight:bold; color:#495057; margin-top:10px; text-align:left;">🔊 Tes Suara Nada Bel Tiap Kelompok:</div>
                <div class="test-audio-grid">
                    <button class="btn-test-sound" onclick="bunyikanSuaraBel('Kelompok 1')">🔔 K1 (Bass)</button>
                    <button class="btn-test-sound" onclick="bunyikanSuaraBel('Kelompok 2')">🔔 K2</button>
                    <button class="btn-test-sound" onclick="bunyikanSuaraBel('Kelompok 3')">🔔 K3</button>
                    <button class="btn-test-sound" onclick="bunyikanSuaraBel('Kelompok 4')">🔔 K4</button>
                    <button class="btn-test-sound" onclick="bunyikanSuaraBel('Kelompok 5')">🔔 K5</button>
                    <button class="btn-test-sound" onclick="bunyikanSuaraBel('Kelompok 6')">🔔 K6</button>
                    <button class="btn-test-sound" onclick="bunyikanSuaraBel('Kelompok 7')">🔔 K7</button>
                    <button class="btn-test-sound" onclick="bunyikanSuaraBel('Kelompok 8')">🔔 K8</button>
                    <button class="btn-test-sound" onclick="bunyikanSuaraBel('Kelompok 9')">🔔 K9 (Treble)</button>
                </div>
            </div>
        </div>

        <div class="card" id="adminScoreboardCard" style="display:none;">
            <h3 style="margin-top:0; text-align:left;">🏆 Papan Skor Semua Kelompok</h3>
            <table>
                <thead>
                    <tr>
                        <th>Kelompok</th>
                        <th style="text-align:right;">Poin</th>
                        <th style="text-align:right;">Aksi Juri</th>
                    </tr>
                </thead>
                <tbody id="tabelPoinAdmin">
                </tbody>
            </table>
        </div>
    </div>

    <!-- TAMPILAN MONITOR -->
    <div id="monitorCard" class="card monitor-card" style="display:none;">
        <div style="text-align: right; margin-bottom: 10px;">
            <button class="btn-logout" style="background: rgba(255,255,255,0.2);" onclick="logout()">🚪 Logout Monitor</button>
        </div>
        <div class="monitor-header">
            <img id="monitorImgLogo" class="monitor-logo" src="" alt="Logo Sekolah">
            <div id="monitorTxtSekolah" class="monitor-school"></div>
            <div id="monitorTxtKegiatan" class="monitor-event"></div>
        </div>
        <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.3); width: 85%;">
        
        <div class="bulb-box">
            <div id="monitorBulb" class="bulb-icon">💡</div>
        </div>

        <div id="monitorTxtKelompok" class="monitor-group"></div>
        <div class="monitor-score-label">TOTAL SKOR</div>
        <div id="monitorTxtSkor" class="monitor-score-val">0</div>
    </div>

</div>

<script>
    // MASUKKAN URL WEB APP GOOGLE APPS SCRIPT ANDA DI SINI
    const API_URL = "https://script.google.com/macros/s/AKfycbw9hjCHqMMoxD0-wrlOKkB0DpAHpZYI8YNRrLsUnznniFDjXqeGY_N-qwiEiCEzcwcCww/exec";

    let activeUsername = '';
    let activeSessionId = '';
    let currentGroup = '';
    let userRole = '';
    let statusInterval = null;
    let lastStatusBel = 'OPEN';

    function bunyikanSuaraBel(namaKelompok) {
        try {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (!AudioContext) return;
            const ctx = new AudioContext();

            const mapNada = {
                'Kelompok 1': { f1: 280, f2: 560 },
                'Kelompok 2': { f1: 330, f2: 660 },
                'Kelompok 3': { f1: 380, f2: 760 },
                'Kelompok 4': { f1: 430, f2: 860 },
                'Kelompok 5': { f1: 480, f2: 960 },
                'Kelompok 6': { f1: 530, f2: 1060 },
                'Kelompok 7': { f1: 580, f2: 1160 },
                'Kelompok 8': { f1: 630, f2: 1260 },
                'Kelompok 9': { f1: 680, f2: 1360 }
            };

            const freq = mapNada[namaKelompok] || { f1: 380, f2: 760 };
            const duration = 1.25;
            const now = ctx.currentTime;

            const masterGain = ctx.createGain();
            masterGain.gain.setValueAtTime(0, now);
            masterGain.gain.linearRampToValueAtTime(0.9, now + 0.01);
            masterGain.gain.setValueAtTime(0.9, now + duration - 0.05);
            masterGain.gain.linearRampToValueAtTime(0.001, now + duration);
            masterGain.connect(ctx.destination);

            const osc1 = ctx.createOscillator();
            osc1.type = 'square';
            osc1.frequency.setValueAtTime(freq.f1, now);

            const osc2 = ctx.createOscillator();
            osc2.type = 'sawtooth';
            osc2.frequency.setValueAtTime(freq.f2, now);

            const gain1 = ctx.createGain();
            gain1.gain.setValueAtTime(0.65, now);
            osc1.connect(gain1);
            gain1.connect(masterGain);

            const gain2 = ctx.createGain();
            gain2.gain.setValueAtTime(0.35, now);
            osc2.connect(gain2);
            gain2.connect(masterGain);

            osc1.start(now);
            osc2.start(now);
            osc1.stop(now + duration);
            osc2.stop(now + duration);

        } catch (e) {
            console.log('Audio tidak didukung:', e);
        }
    }

    window.onload = function() {
        fetch(API_URL + '?action=getConfig')
            .then(res => res.json())
            .then(config => {
                if(config) {
                    document.getElementById('loginTxtSekolah').innerText = config.namaSekolah || 'Cerdas Cermat';
                    document.getElementById('loginTxtKegiatan').innerText = config.namaKegiatan || '';
                    if(config.urlLogo) {
                        const img = document.getElementById('loginImgLogo');
                        img.src = config.urlLogo;
                        img.style.display = 'inline-block';
                    }
                }
            })
            .catch(err => {
                document.getElementById('loginTxtSekolah').innerText = 'Aplikasi Cerdas Cermat';
            });
    };

    function login() {
        const user = document.getElementById('usernameInput').value;
        const pass = document.getElementById('passwordInput').value;
        document.getElementById('loginError').innerText = 'Memeriksa...';

        fetch(API_URL, {
            method: 'POST',
            body: JSON.stringify({ action: 'login', username: user, password: pass })
        })
        .then(res => res.json())
        .then(res => {
            if(res.success) {
                activeUsername = res.username;
                activeSessionId = res.sessionId;
                currentGroup = res.namaKelompok;
                userRole = res.role;

                document.getElementById('loginCard').style.display = 'none';

                if(res.namaSekolah) {
                    document.getElementById('txtNamaSekolah').innerText = res.namaSekolah;
                    document.getElementById('monitorTxtSekolah').innerText = res.namaSekolah;
                }
                if(res.namaKegiatan) {
                    document.getElementById('txtNamaKegiatan').innerText = res.namaKegiatan;
                    document.getElementById('monitorTxtKegiatan').innerText = res.namaKegiatan;
                }
                if(res.urlLogo) {
                    document.getElementById('imgLogo').src = res.urlLogo;
                    document.getElementById('monitorImgLogo').src = res.urlLogo;
                } else {
                    document.getElementById('imgLogo').style.display = 'none';
                    document.getElementById('monitorImgLogo').style.display = 'none';
                }

                if (userRole === 'MONITOR') {
                    document.getElementById('monitorCard').style.display = 'block';
                    document.getElementById('monitorTxtKelompok').innerText = res.namaKelompok;
                } else {
                    document.getElementById('headerBar').style.display = 'flex';
                    document.getElementById('appCard').style.display = 'block';
                    document.getElementById('kelompokTitle').innerText = res.namaKelompok;

                    if(userRole === 'ADMIN') {
                        document.getElementById('adminPanel').style.display = 'block';
                        document.getElementById('adminScoreboardCard').style.display = 'block';
                    } else {
                        document.getElementById('tombolBel').style.display = 'block';
                    }
                }

                // INTERVAL POLLING OPTIMAL: Admin & Peserta 1000ms, Monitor 2500ms
                let intervalTime = (userRole === 'MONITOR') ? 2500 : 1000;
                statusInterval = setInterval(checkStatus, intervalTime);
            } else {
                document.getElementById('loginError').innerText = res.message;
            }
        });
    }

    function logout() {
        if (statusInterval) clearInterval(statusInterval);
        
        fetch(API_URL, {
            method: 'POST',
            body: JSON.stringify({ action: 'logout', username: activeUsername, sessionId: activeSessionId })
        });

        activeUsername = '';
        activeSessionId = '';
        currentGroup = '';
        userRole = '';
        lastStatusBel = 'OPEN';

        document.getElementById('usernameInput').value = '';
        document.getElementById('passwordInput').value = '';
        document.getElementById('loginError').innerText = '';

        document.getElementById('headerBar').style.display = 'none';
        document.getElementById('appCard').style.display = 'none';
        document.getElementById('adminPanel').style.display = 'none';
        document.getElementById('adminScoreboardCard').style.display = 'none';
        document.getElementById('tombolBel').style.display = 'none';
        document.getElementById('monitorCard').style.display = 'none';
        
        document.getElementById('loginCard').style.display = 'block';
    }

    function prosesTekanBel() {
        document.getElementById('tombolBel').disabled = true;
        fetch(API_URL, {
            method: 'POST',
            body: JSON.stringify({ action: 'tekanBel', kelompok: currentGroup })
        });
    }

    function checkStatus() {
        fetch(`${API_URL}?action=getStatus&username=${encodeURIComponent(activeUsername)}&sessionId=${encodeURIComponent(activeSessionId)}`)
        .then(res => res.json())
        .then(res => {
            if (!res.sessionValid) {
                alert('Sesi Anda telah berakhir.');
                logout();
                return;
            }

            if(res.namaSekolah) {
                document.getElementById('txtNamaSekolah').innerText = res.namaSekolah;
                document.getElementById('monitorTxtSekolah').innerText = res.namaSekolah;
            }
            if(res.namaKegiatan) {
                document.getElementById('txtNamaKegiatan').innerText = res.namaKegiatan;
                document.getElementById('monitorTxtKegiatan').innerText = res.namaKegiatan;
            }
            if(res.urlLogo) {
                document.getElementById('imgLogo').src = res.urlLogo;
                document.getElementById('monitorImgLogo').src = res.urlLogo;
            }

            if (res.status === 'LOCKED' && lastStatusBel === 'OPEN') {
                if (userRole === 'ADMIN') {
                    bunyikanSuaraBel(res.pemenang);
                }
            }
            lastStatusBel = res.status;

            const appBulb = document.getElementById('appBulb');
            const monitorBulb = document.getElementById('monitorBulb');

            if (userRole !== 'MONITOR') {
                const btn = document.getElementById('tombolBel');
                const statusBox = document.getElementById('statusBox');

                if (res.status === 'LOCKED') {
                    btn.disabled = true;
                    
                    if (userRole === 'ADMIN') {
                        statusBox.innerText = `💡 BEL DITEKAN OLEH: ${res.pemenang}`;
                        statusBox.style.backgroundColor = '#fff3cd';
                        statusBox.style.color = '#856404';
                        if(appBulb) appBulb.classList.add('on');
                    } else if (res.pemenang === currentGroup) {
                        statusBox.innerText = '💡 ANDA MENEKAN BEL LEBIH DULU!';
                        statusBox.style.backgroundColor = '#d4edda';
                        statusBox.style.color = '#155724';
                        if(appBulb) appBulb.classList.add('on');
                    } else {
                        statusBox.innerText = `🔒 Bel Ditekan oleh: ${res.pemenang}`;
                        statusBox.style.backgroundColor = '#f8d7da';
                        statusBox.style.color = '#721c24';
                        if(appBulb) appBulb.classList.remove('on');
                    }
                } else {
                    btn.disabled = false;
                    statusBox.innerText = '🟢 Status: Bel SIAP DITEKAN!';
                    statusBox.style.backgroundColor = '#e9ecef';
                    statusBox.style.color = '#212529';
                    if(appBulb) appBulb.classList.remove('on');
                }
            }

            if (userRole === 'MONITOR') {
                if (res.status === 'LOCKED' && res.pemenang === currentGroup) {
                    if(monitorBulb) monitorBulb.classList.add('on');
                } else {
                    if(monitorBulb) monitorBulb.classList.remove('on');
                }
            }

            if (userRole === 'ADMIN') {
                renderScoreboardAdmin(res.daftarPoin, res.status, res.pemenang);
            } else if (userRole === 'MONITOR') {
                renderScoreboardMonitor(res.daftarPoin);
            }

        });
    }

    function renderScoreboardAdmin(dataPoin, statusBel, pemenangBel) {
        const tbody = document.getElementById('tabelPoinAdmin');
        tbody.innerHTML = '';

        dataPoin.forEach(item => {
            let tr = document.createElement('tr');
            let isWinner = (statusBel === 'LOCKED' && item.nama === pemenangBel);

            if (isWinner) {
                tr.classList.add('row-winner');
            }

            tr.innerHTML = `<td><b>${item.nama}</b> ${isWinner ? '💡 <span style="color:#d35400;">(MENEKAN BEL!)</span>' : ''}</td>
                            <td class="poin-val">${item.poin}</td>
                            <td style="text-align:right; white-space:nowrap;">
                                <button class="btn-plus" onclick="koreksiPoin('${item.nama}', 100)">+100</button>
                                <button class="btn-plus" onclick="koreksiPoin('${item.nama}', 10)">+10</button>
                                <button class="btn-minus" onclick="koreksiPoin('${item.nama}', -10)">-10</button>
                                <button class="btn-minus" onclick="koreksiPoin('${item.nama}', -100)">-100</button>
                                <button class="btn-edit" onclick="editSkorLangsung('${item.nama}', ${item.poin})">✏️ Edit</button>
                            </td>`;
            tbody.appendChild(tr);
        });
    }

    function renderScoreboardMonitor(dataPoin) {
        const item = dataPoin.find(x => x.nama === currentGroup);
        if(item) {
            document.getElementById('monitorTxtSkor').innerText = item.poin;
        }
    }

    function koreksiPoin(nama, delta) {
        fetch(API_URL, {
            method: 'POST',
            body: JSON.stringify({ action: 'ubahPoin', kelompok: nama, delta: delta })
        });
    }

    function editSkorLangsung(nama, poinSekarang) {
        let inputBaru = prompt(`Masukkan nilai/skor baru untuk ${nama}:`, poinSekarang);
        if (inputBaru !== null && inputBaru.trim() !== '') {
            let skorAngka = parseInt(inputBaru.trim(), 10);
            if (!isNaN(skorAngka)) {
                fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'setSkor', kelompok: nama, skorBaru: skorAngka })
                });
            } else {
                alert('Silakan masukkan angka yang valid!');
            }
        }
    }

    function prosesResetBel() {
        fetch(API_URL, {
            method: 'POST',
            body: JSON.stringify({ action: 'resetBel' })
        });
    }

    function prosesResetSemuaPoin() {
        if (confirm('Apakah Anda yakin ingin mereset seluruh skor kelompok menjadi 0?')) {
            fetch(API_URL, {
                method: 'POST',
                body: JSON.stringify({ action: 'resetSemuaPoin' })
            });
        }
    }
</script>

</body>
</html>
